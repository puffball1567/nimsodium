name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Linux · libsodium ${{ matrix.libsodium }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libsodium:
          - system
          - "1.0.22"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config

      - name: Install system libsodium
        if: matrix.libsodium == 'system'
        run: sudo apt-get install -y libsodium-dev

      - name: Build libsodium 1.0.22
        if: matrix.libsodium == '1.0.22'
        env:
          SODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz \
            --output "$RUNNER_TEMP/libsodium-1.0.22.tar.gz"
          echo "$SODIUM_SHA256  $RUNNER_TEMP/libsodium-1.0.22.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/libsodium-1.0.22.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libsodium-1.0.22"
          ./configure --prefix="$RUNNER_TEMP/libsodium"
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libsodium/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/libsodium/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libsodium/lib" >> "$GITHUB_ENV"
          echo "NIMSODIUM_EXPECTED_LIBSODIUM=1.0.22" >> "$GITHUB_ENV"

      - name: Check libsodium
        run: pkg-config --modversion libsodium

      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Check Nim
        run: nim --version

      - name: Check package metadata
        run: nimble check

      - name: Check library
        run: |
          nim check --path:src --nimcache:/tmp/nimsodium_nimcache src/nimsodium.nim
          nim check --path:src --nimcache:/tmp/nimsodium_nimcache src/nimsodium/advanced.nim

      - name: Run tests
        run: nim c -r --path:src --nimcache:/tmp/nimsodium_nimcache tests/test_nimsodium.nim

      - name: Run C ABI smoke test
        run: nimble testCAbi

      - name: Compile examples
        run: |
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_quickstart examples/quickstart.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_passwords examples/passwords.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_secret_data examples/secret_data.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_public_key examples/public_key.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_signatures examples/signatures.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_authentication examples/authentication.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_key_derivation examples/key_derivation.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_file_encryption examples/file_encryption.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_advanced examples/advanced.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_tokens examples/tokens.nim
          nim c -r --path:src --nimcache:/tmp/nimsodium_example_cleanup examples/cleanup.nim

      - name: Generate API docs
        run: |
          nim doc --project --index:on --outdir:htmldocs --path:src src/nimsodium.nim
          nim doc --outdir:htmldocs --path:src src/nimsodium/advanced.nim
